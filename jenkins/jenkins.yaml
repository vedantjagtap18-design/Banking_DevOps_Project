jenkins:
  systemMessage: "Apex Trust Bank - Automated CI/CD Jenkins Server"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: |
      pipelineJob('Banking-App-CI-CD') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/YOUR_USERNAME/DevOps_mini_project.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          scm('H/2 * * * *')
        }
      }
